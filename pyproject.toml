[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "hfx-tools"
dynamic = ["version"]
description = "Tools for building, inspecting, and QC'ing HFX submissions"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
  { name = "Society for Immune Polymorphism" },
]
maintainers = [
  { name = "Martin Maiers" },
]
keywords = [
  "bioinformatics",
  "haplotype",
  "HLA",
  "immunogenetics",
  "population genetics",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/societyforimmunepolymorphism/hfx-tools"
Repository = "https://github.com/societyforimmunepolymorphism/hfx-tools"
Issues = "https://github.com/societyforimmunepolymorphism/hfx-tools/issues"
"HFX Specification" = "https://github.com/societyforimmunepolymorphism/hfx"
"Related Tools" = "https://github.com/nmdp-bioinformatics/phycus"

[project.optional-dependencies]
parquet = ["pandas>=2.0", "pyarrow>=14.0"]
streamlit = ["streamlit>=1.0"]

[project.scripts]
hfx-tools = "hfx_tools.cli:main"
hfx-pack = "hfx_tools.cli:pack_main"
hfx-qc = "hfx_tools.cli:qc_main"
hfx-inspect = "hfx_tools.cli:inspect_main"
hfx-build = "hfx_tools.cli:build_main"
hfx-reduce-loci = "hfx_tools.cli:reduce_main"

[tool.setuptools.packages.find]
where = ["."]
include = ["hfx_tools*"]

[tool.setuptools.dynamic]
version = { attr = "hfx_tools.__version__" }

[dependency-groups]
# uv dependency groups (install via `uv sync`; include all groups by default)
dev = [
  "pytest>=8.0",
]
lint = [
  "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# Reasonable defaults; tweak as you like
select = ["E", "F", "I", "B", "UP"]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["hfx_tools"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-q"
testpaths = ["tests"]
